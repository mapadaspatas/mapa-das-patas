name: CI

# Sem filtro de `paths`: um status check obrigatório que não roda nunca reporta,
# e o PR fica travado para sempre esperando um resultado que não vem.
on:
  pull_request:
  push:
    branches: [main]

# Só leitura: nenhum passo daqui escreve no repositório, e PR vindo de fork
# roda com token restrito e sem segredo (a suíte não depende de nenhum).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  verify:
    name: Validar Iniciativas, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sem `version`: a versão vem do campo `packageManager` do package.json.
      # Declarar as duas quebra o job ("Multiple versions of pnpm specified").
      # pnpm antes do setup-node: o cache do setup-node precisa dele no PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Validar arquivos de Iniciativa (schema + regra da Fonte)
        run: node scripts/validate-initiatives.ts

      - name: Testes
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build estático
        run: pnpm generate
